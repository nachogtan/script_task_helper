name: CI for Task Helper

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Chequear el repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Fix: remover PS1 y PROMPT_COMMAND para evitar errores con __git_ps1
      - name: Clean runner environment
        run: |
          unset PROMPT_COMMAND
          unset PS1

      # 3. Dar permisos de ejecución
      - name: Set bash permissions
        run: chmod +x task_helper.sh

      # 4. Ejecutar script en modo CI
      - name: Run task_helper.sh in CI mode
        run: ./task_helper.sh --ci
